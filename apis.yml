aid: ventura
name: Ventura
description: >-
  Ventura builds the AI workforce for distributors and manufacturers, starting
  with quoting and order entry. It reads inbound requests in any format - emails,
  PDFs, images, and phone calls - matches products against the customer's catalog,
  drafts a quote or order for a sales rep to review and approve, and pushes the
  approved result into the customer's ERP, with sales intelligence and a phone
  agent that transcribes rep calls and creates the resulting quote or order.
  Ventura plugs into the ERP and CRM a distributor already runs, follows the
  team's documented procedures, and learns from every correction. Ventura
  (formerly Autola) is operated by Gradient Ascent Labs, Inc., a Y Combinator
  Winter 2026 company based in San Francisco founded by Swen Koller and Jack
  Collins. As of 2026-08-14 the company publishes a marketing website and a
  privacy policy only: no public API, developer portal, documentation, SDK,
  OpenAPI, MCP server, or agent card was found on any Ventura host, and the
  customer application at app.ventura.ai redirects every path to a login.
